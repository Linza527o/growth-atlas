<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>登录 · Growth Atlas</title>
  <style>
    :root{--ink:#1d1d1f;--secondary:#6e6e73;--line:#d2d2d7;--blue:#0071e3}
    *{box-sizing:border-box}
    html{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
    body{min-height:100svh;margin:0;display:flex;flex-direction:column}
    button,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible{outline:3px solid #87bfff;outline-offset:3px}
    .topbar{width:100%;border-bottom:1px solid #f0f0f2}
    .topbar-inner{height:62px;max-width:1100px;margin:auto;padding:0 36px;display:flex;align-items:center;justify-content:space-between}
    .wordmark{display:flex;gap:9px;align-items:center;font-size:16px;font-weight:650;letter-spacing:-.035em}
    .wordmark-icon{display:grid;place-items:center;width:25px;height:25px;background:#1d1d1f;border-radius:7px;color:#fff;font:18px Georgia,serif}
    .topbar-note{font-size:12px;color:#86868b}
    main{flex:1;display:flex;justify-content:center;align-items:center;padding:50px 24px 75px}
    .login{width:100%;max-width:406px;text-align:center}
    .mark{height:64px;width:64px;margin:0 auto 28px;background:linear-gradient(145deg,#a2c6ff,#386be1 65%,#6753c8);border-radius:17px;box-shadow:0 11px 28px rgba(51,104,211,.13);color:white;display:grid;place-items:center;font:38px Georgia,serif}
    h1{font-size:clamp(31px,5vw,42px);line-height:1.13;font-weight:700;letter-spacing:-.048em;margin:0}
    .subtitle{margin:17px auto 37px;max-width:390px;color:var(--secondary);font-size:15px;line-height:1.65}
    form{text-align:left;width:100%}
    label{display:block;margin:0 0 11px;font-size:12px;font-weight:650;color:#424245}
    .field{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;height:57px;background:#fff;transition:border .15s,box-shadow .15s}
    .field:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.10)}
    input{flex:1;width:100%;min-width:0;height:100%;padding:0 16px;border:0;border-radius:14px;background:transparent;color:var(--ink);font-size:16px;outline:none}
    input::placeholder{color:#9b9ba0}
    input:focus-visible{outline:0}
    .toggle{height:40px;padding:0 15px;border:0;background:none;color:#0066cc;font-size:13px;white-space:nowrap}
    .toggle:hover{text-decoration:underline}
    .submit{display:block;width:100%;border:0;border-radius:999px;background:var(--blue);color:white;font-size:16px;font-weight:600;min-height:49px;padding:12px 20px;margin-top:19px;transition:background .15s}
    .submit:hover{background:#0077ed}
    .submit:active{background:#0066cc}
    .submit:disabled{opacity:.65;cursor:wait}
    .error{min-height:26px;color:#bf333b;font-size:13px;line-height:1.5;margin-top:12px;text-align:center}
    .footnote{text-align:center;font-size:12px;color:#86868b;margin-top:13px}
    footer{border-top:1px solid #f0f0f2;color:#86868b;padding:19px 36px;text-align:center;font-size:11px;letter-spacing:.01em}
    @media(max-width:600px){
      .topbar-inner{height:55px;padding:0 22px}
      .topbar-note{font-size:11px}
      main{padding:55px 27px 70px;align-items:flex-start}
      .mark{margin-bottom:29px}
      h1{font-size:32px}
      .subtitle{font-size:14px;margin-bottom:34px}
      footer{padding:17px 20px}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="wordmark"><span class="wordmark-icon" aria-hidden="true">G</span><span>Growth Atlas</span></div>
      <span class="topbar-note">Personal Journal</span>
    </div>
  </header>
  <main>
    <section class="login" aria-labelledby="welcome">
      <div class="mark" aria-hidden="true">G</div>
      <h1 id="welcome">你的成长，尽在这里。</h1>
      <p class="subtitle">记录学习、科研、项目与生活。<br>输入访问密码，继续你的成长日历。</p>
      <form id="loginForm">
        <label for="password">访问密码</label>
        <div class="field">
          <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" required autofocus>
          <button class="toggle" id="toggle" type="button" aria-label="显示或隐藏密码">显示</button>
        </div>
        <button class="submit" id="submit" type="submit">继续 <span aria-hidden="true">→</span></button>
        <div class="error" id="error" aria-live="polite"></div>
      </form>
      <p class="footnote">个人成长记录 · 始于 2026 年 8 月</p>
    </section>
  </main>
  <footer>Growth Atlas © 2026</footer>
<script>
const ACCESS_HASH="3f55f98f2811bb4a04f81c5dff5974bf2f50a86e8c1baba782991a0f6e214bde",ACCESS_KEY="growthAtlasGate";
/* Always show password prompt on entering the root; reset previous tab unlock. */
try{sessionStorage.removeItem(ACCESS_KEY)}catch(err){}
document.getElementById("toggle").onclick=()=>{const f=document.getElementById("password");f.type=f.type==="password"?"text":"password";document.getElementById("toggle").textContent=f.type==="password"?"显示":"隐藏"};
document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=document.getElementById("submit"),msg=document.getElementById("error");
 btn.disabled=true;msg.textContent="";
 try{
   const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(document.getElementById("password").value));
   const sum=Array.from(new Uint8Array(buf),v=>v.toString(16).padStart(2,"0")).join("");
   if(sum===ACCESS_HASH){sessionStorage.setItem(ACCESS_KEY,ACCESS_HASH);location.replace("./calendar.html");return;}
   msg.textContent="密码错误，请重新输入。";document.getElementById("password").select();
 }catch(err){msg.textContent="验证失败，请检查浏览器设置并使用 HTTPS 地址访问。"}
 finally{btn.disabled=false;}
});
</script>
</body>
</html>
