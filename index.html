<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><meta name="robots" content="noindex,nofollow">
<title>Growth Atlas · 访问日历</title>
<style>
:root{--bg:#f6f5f0;--ink:#20343c;--muted:#71837e;--accent:#356a61}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 18% 15%,#dcebe4,transparent 58%),radial-gradient(ellipse at 90% 85%,#e7e8da,transparent 46%),var(--bg)}
main{width:min(100%,435px);padding:40px 36px 30px;background:#fffefa;border:1px solid #e3e8e1;border-radius:22px;box-shadow:0 24px 90px #16322b16}
.logo-line{display:flex;align-items:center;gap:12px;margin-bottom:36px}
.logo{width:45px;height:45px;border-radius:14px;background:#223a3e;color:white;display:grid;place-items:center;font:27px Georgia,serif}
.brand{font-weight:750;font-size:19px}.brand-sub{font-size:9px;letter-spacing:.2em;color:#83948d}
.eyebrow{color:#4b8173;font-size:11px;letter-spacing:.16em;font-weight:700}
h1{font-size:29px;line-height:1.25;letter-spacing:-.035em;margin:12px 0 12px}
p{font-size:14px;line-height:1.8;color:#70837f;margin:0 0 26px}
label{font-size:12px;font-weight:700;display:block;margin-bottom:10px}
.field{border:1px solid #c8d9d1;border-radius:12px;display:flex;align-items:center;padding:5px 9px 5px 15px;background:white}
.field:focus-within{border-color:#4a8176;box-shadow:0 0 0 3px #4a817619}
input{flex:1;min-width:0;font-size:16px;height:43px;border:0;outline:0}
.toggle{background:none;color:#6d827b;border:0;cursor:pointer;padding:9px}
.submit{width:100%;background:#30665d;border:0;color:white;font-size:14px;font-weight:750;border-radius:12px;padding:14px;margin-top:16px;cursor:pointer}.submit:hover{background:#254e48}.submit:disabled{opacity:.65}
.error{min-height:24px;color:#ac4650;font-size:12px;margin-top:12px}
footer{border-top:1px solid #e4eae5;padding-top:19px;color:#99aaa2;font-size:10px;letter-spacing:.12em;margin-top:7px}
@media(max-width:480px){main{padding:28px 24px}h1{font-size:26px}}
</style>
</head>
<body>
<main>
  <div class="logo-line"><span class="logo">G</span><div><div class="brand">Growth Atlas</div><div class="brand-sub">PERSONAL GROWTH JOURNAL</div></div></div>
  <div class="eyebrow">DAILY ARCHIVE · ACCESS</div>
  <h1>记录成长的每一天。</h1>
  <p>学习、科研、项目与日常。请输入访问密码，继续查看你的个人成长日历。</p>
  <form id="loginForm">
    <label for="password">访问密码</label>
    <div class="field"><input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" required autofocus><button class="toggle" id="toggle" type="button">显示</button></div>
    <button class="submit" id="submit" type="submit">解锁成长日历 →</button>
    <div class="error" id="error" aria-live="polite"></div>
  </form>
  <footer>GROWTH ATLAS · EST. 30 AUG 2026</footer>
</main>
<script>
const ACCESS_HASH="3f55f98f2811bb4a04f81c5dff5974bf2f50a86e8c1baba782991a0f6e214bde",ACCESS_KEY="growthAtlasGate";
try{if(sessionStorage.getItem(ACCESS_KEY)===ACCESS_HASH)location.replace("./calendar.html")}catch(err){}
document.getElementById("toggle").onclick=()=>{const f=document.getElementById("password");f.type=f.type==="password"?"text":"password";document.getElementById("toggle").textContent=f.type==="password"?"显示":"隐藏"};
document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=document.getElementById("submit"),msg=document.getElementById("error");
 btn.disabled=true;msg.textContent="";
 try{
   const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(document.getElementById("password").value));
   const sum=Array.from(new Uint8Array(buf),v=>v.toString(16).padStart(2,"0")).join("");
   if(sum===ACCESS_HASH){sessionStorage.setItem(ACCESS_KEY,ACCESS_HASH);location.replace("./calendar.html");return;}
   msg.textContent="密码错误，请重新输入。";document.getElementById("password").select();
 }catch(err){msg.textContent="验证失败，请检查浏览器设置并使用 HTTPS 地址访问。"}
 finally{btn.disabled=false;}
});
</script>
</body>
</html>
