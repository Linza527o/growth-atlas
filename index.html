<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <title>登录 Growth Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#1d1d1f;--muted:#6e6e73;--subtle:#86868b;--line:#d2d2d7;--blue:#0071e3}
    *,*::before,*::after{box-sizing:border-box}
    html{min-height:100%;background:#fff;-webkit-font-smoothing:antialiased}
    body{margin:0;min-height:100svh;display:flex;flex-direction:column;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible{outline:3px solid #80baff;outline-offset:3px}
    .global-nav{height:45px;background:#f5f5f7;border-bottom:1px solid rgba(0,0,0,.04)}
    .global-nav__inner{height:100%;max-width:1040px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
    .global-nav__text{font-size:12px;letter-spacing:-.015em;font-weight:600;color:#4b4b4f}
    .global-nav__minor{font-size:11px;color:#86868b}
    .product-header{max-width:1040px;margin:0 auto;width:100%;min-height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dedee2}
    .product-name{font-size:21px;font-weight:650;letter-spacing:-.035em}
    .product-label{font-size:12px;color:var(--muted)}
    main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:clamp(95px,14vh,158px) 24px 76px}
    .signin{width:100%;max-width:430px;text-align:center}
    h1{font-size:clamp(34px,4.3vw,43px);line-height:1.16;font-weight:665;letter-spacing:-.05em;margin:0}
    .subtitle{font-size:17px;line-height:1.6;color:var(--muted);margin:15px 0 43px}
    form{margin:0;text-align:left}
    .field{height:57px;border:1px solid #86868b;border-radius:12px;display:flex;align-items:center;background:#fff;transition:border-color .15s,box-shadow .15s}
    .field:focus-within{border:2px solid var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.10)}
    input{background:transparent;border:0;outline:none!important;height:100%;flex:1;min-width:0;width:100%;padding:0 16px;font-size:17px;letter-spacing:0;color:var(--ink)}
    input::placeholder{color:#86868b;opacity:1}
    input:focus-visible{outline:0}
    .toggle{border:0;background:transparent;color:#6e6e73;font-size:12px;font-weight:500;padding:9px 8px;white-space:nowrap}
    .toggle:hover{color:#0066cc}
    .submit{flex-shrink:0;display:grid;place-items:center;border:1.5px solid #8d8d92;background:#fff;color:#6e6e73;width:31px;height:31px;border-radius:100%;padding:0;margin:0 12px 0 3px;transition:background .15s,color .15s,border-color .15s}
    .submit::after{content:"";display:block;width:10px;height:10px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg);margin-left:-4px}
    .submit:hover{background:#1d1d1f;border-color:#1d1d1f;color:#fff}
    .submit:disabled{opacity:.55;cursor:wait}
    .submit .submit-copy{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .error{min-height:22px;margin-top:12px;font-size:13px;color:#bf333b;text-align:left}
    .help{font-size:13px;line-height:1.65;color:var(--subtle);margin:12px 0 0;text-align:center}
    footer{background:#f5f5f7;margin-top:auto;padding:20px 24px;color:#6e6e73;font-size:11px}
    .footer-inner{max-width:1040px;margin:auto;display:flex;justify-content:space-between;gap:14px}
    @media(max-width:600px){
      .product-header{min-height:58px}
      .product-name{font-size:19px}
      main{padding:105px 24px 66px}
      h1{font-size:34px}
      .subtitle{font-size:16px;margin:15px 0 38px}
      .footer-inner{flex-direction:column;gap:7px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  
/* MATCHED SITEWIDE VISUAL SYSTEM / APPLE.COM-INSPIRED */
.global-nav{height:48px;background:rgba(22,22,23,.96);border-bottom:0;color:#f5f5f7}
.global-nav__inner{height:48px;max-width:1360px}
.global-nav__text{font-size:13px;font-weight:650;color:#f5f5f7}
.global-nav__minor{color:#c5c5c9;font-size:11px}
.product-header{max-width:1360px;min-height:59px;border-bottom:1px solid #e5e5e7}
.product-name{font-size:19px;font-weight:675}
.product-label{font-size:12px;color:#86868b}
main{padding-top:clamp(103px,15vh,172px)}
.signin{max-width:445px;animation:signInRise .72s cubic-bezier(.22,1,.36,1) both}
h1{font-size:clamp(36px,4vw,48px);font-weight:685;letter-spacing:-.055em}
.subtitle{font-size:17px;margin:17px 0 47px}
.field{height:60px;border-radius:13px;transition:border-color .25s,box-shadow .25s}
.field:focus-within{box-shadow:0 0 0 4px rgba(0,113,227,.11)}
.submit{transition:background .24s,color .24s,transform .3s cubic-bezier(.22,1,.36,1)}
.submit:hover{transform:translateX(2px)}
@keyframes signInRise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media(max-width:600px){.global-nav__inner{padding:0 20px}.product-header{padding:0 20px}.signin{width:100%}main{padding:90px 24px 60px}h1{font-size:36px}.subtitle{font-size:15px;margin-bottom:41px}}
@media(prefers-reduced-motion:reduce){.signin{animation:none}.submit{transition:none}}


/* Apple.com-inspired sitewide entry presentation, coordinated with immersive journal */
.global-nav{height:48px;background:rgba(22,22,23,.96)}
.global-nav__inner{height:48px;max-width:1060px}
.global-nav__text{font-size:13px;color:#f5f5f7;font-weight:620}
.global-nav__minor{color:#b5b5bc;font-size:11px}
.product-header{height:65px;border-bottom:1px solid #e5e5e7}
main{flex:1;padding:clamp(108px,16vh,171px) 24px 95px}
.signin{max-width:450px}
h1{font-size:clamp(40px,4.8vw,53px);font-weight:700;letter-spacing:-.065em;line-height:1.11}
.subtitle{font-size:17px;color:#6e6e73;line-height:1.6;margin:21px 0 51px}
.field{height:60px;border-radius:13px}
input{font-size:17px}
.help{color:#86868b}
@media(max-width:600px){main{padding:115px 24px 65px}h1{font-size:42px}.subtitle{font-size:16px}.product-header{height:57px}}


/* APPLE-STYLE TYPOGRAPHY PALETTE V5 - unified with calendar */
:root{--ink:#1d1d1f;--muted:#6e6e73;--subtle:#86868b;--line:#d2d2d7;--blue:#0071e3}
html{background:#fff;color:#1d1d1f;font-family:"SF Pro Text","SF Pro Display",Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{background:#fff;color:#1d1d1f;font-weight:400}
.global-nav{background:rgba(250,250,252,.96);height:48px;border-bottom:1px solid rgba(0,0,0,.045)}
.global-nav__inner{height:48px;max-width:1120px;padding:0 24px}
.global-nav__text{color:#1d1d1f;font-size:13px;font-weight:600;letter-spacing:-.02em}
.global-nav__minor{color:#6e6e73;font-size:11px}
.product-header{max-width:1120px;min-height:58px;height:58px;border-bottom:1px solid #e5e5e7}
.product-name{font-size:19px;font-weight:600;color:#1d1d1f}
.product-label{color:#6e6e73;font-size:12px}
main{padding:clamp(95px,14vh,145px) 24px 85px}
.signin{max-width:430px}
h1{font-family:"SF Pro Display",Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:clamp(38px,4.5vw,47px);font-weight:600;line-height:1.12;letter-spacing:-.04em}
.subtitle{font-size:17px;font-weight:400;color:#6e6e73;line-height:1.5;margin:18px 0 42px}
.field{height:58px;border-color:#86868b;border-radius:11px;box-shadow:none}
.field:focus-within{border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.12)}
input{font-family:inherit;font-size:17px;font-weight:400}
input::placeholder{color:#86868b}
.toggle{color:#0066cc;font-size:12px;font-weight:400}
.help{color:#86868b}
.submit{border:1px solid #86868b;background:#fff;color:#6e6e73}
.submit:hover{background:#0071e3;color:#fff;border-color:#0071e3}
footer{background:#f5f5f7;color:#6e6e73;font-size:11px}
@media(max-width:600px){main{padding:100px 24px 60px}h1{font-size:38px}.subtitle{font-size:16px}.product-header{height:55px;min-height:55px}}

</style>
</head>
<body>
  <header>
    <div class="global-nav">
      <div class="global-nav__inner">
        <span class="global-nav__text">Growth Atlas</span>
        <span class="global-nav__minor">Personal Journal</span>
      </div>
    </div>
    <div class="product-header">
      <span class="product-name">Growth Atlas</span>
      <span class="product-label">个人成长日历</span>
    </div>
  </header>
  <main>
    <section class="signin" aria-labelledby="pageTitle">
      <h1 id="pageTitle">登录 Growth Atlas</h1>
      <p class="subtitle">输入密码，继续查看你的成长日历。</p>
      <form id="loginForm">
        <div class="field">
          <input id="password" type="password" placeholder="密码" aria-label="访问密码" autocomplete="current-password" required autofocus>
          <button class="toggle" id="toggle" type="button" aria-label="显示或隐藏密码">显示</button>
          <button class="submit" id="submit" type="submit" aria-label="解锁日历"><span class="submit-copy">继续</span></button>
        </div>
        <div class="error" id="error" aria-live="polite"></div>
      </form>
      <p class="help">仅供个人访问</p>
    </section>
  </main>
  <footer><div class="footer-inner"><span>© 2026 Growth Atlas</span><span>记录每一天的学习与成长。</span></div></footer>
<script>
const ACCESS_HASH="b8f85a901bd8f23020f681f4c160dc1c2487f49b58f9d4b0bd22fbe3a126704a",ACCESS_KEY="growthAtlasGate";
/* Always show password prompt on entering the root; reset previous tab unlock. */
try{sessionStorage.removeItem(ACCESS_KEY)}catch(err){}
document.getElementById("toggle").onclick=()=>{const f=document.getElementById("password");f.type=f.type==="password"?"text":"password";document.getElementById("toggle").textContent=f.type==="password"?"显示":"隐藏"};
document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=document.getElementById("submit"),msg=document.getElementById("error");
 btn.disabled=true;msg.textContent="";
 try{
   const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(document.getElementById("password").value));
   const sum=Array.from(new Uint8Array(buf),v=>v.toString(16).padStart(2,"0")).join("");
   if(sum===ACCESS_HASH){sessionStorage.setItem(ACCESS_KEY,ACCESS_HASH);location.replace("./calendar.html");return;}
   msg.textContent="密码错误，请重新输入。";document.getElementById("password").select();
 }catch(err){msg.textContent="验证失败，请检查浏览器设置并使用 HTTPS 地址访问。"}
 finally{btn.disabled=false;}
});
</script>
</body>
</html>
